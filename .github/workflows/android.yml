name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install packages
        run: |
          npm install
          V=$(node -p "require('@capacitor/core/package.json').version.split('.')[0]")
          npm install @capacitor/share@$V @capacitor/local-notifications@$V
      - name: Clear old android folder
        run: |
          mkdir -p native
          [ -f android/app/src/main/res/raw/order_alert.wav ] && cp android/app/src/main/res/raw/order_alert.wav native/order_alert.wav || true
          rm -rf android
      - name: Create Android project
        run: npx cap add android
      - name: Add native alarm code
        run: |
          PKG=$(grep -oP 'namespace\s*=?\s*"\K[^"]+' android/app/build.gradle | head -1)
          DIR=android/app/src/main/java/$(echo "$PKG" | tr . /)
          mkdir -p "$DIR" android/app/src/main/res/raw
          cp native/order_alert.wav android/app/src/main/res/raw/
          cp www/sounds/snd_*.wav android/app/src/main/res/raw/   # extra alarm sounds
          sed "s/^package .*/package $PKG;/" native/KeepAlivePlugin.java > "$DIR/KeepAlivePlugin.java"
          sed "s/^package .*/package $PKG;/" native/KeepAliveService.java > "$DIR/KeepAliveService.java"
          cat > "$DIR/MainActivity.java" <<JAVA
          package $PKG;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override public void onCreate(Bundle b) {
              registerPlugin(KeepAlivePlugin.class);
              super.onCreate(b);
            }
          }
          JAVA
          M=android/app/src/main/AndroidManifest.xml
          PERMS='<uses-permission android:name="android.permission.FOREGROUND_SERVICE"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/><uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/><uses-permission android:name="android.permission.VIBRATE"/>'
          SVC='<service android:name=".KeepAliveService" android:exported="false" android:foregroundServiceType="specialUse"><property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="Receives restaurant orders"/></service>'
          sed -i "s#<application#$PERMS<application#" "$M"
          sed -i "s#</application>#$SVC</application>#" "$M"
      - name: Add Firebase config
        run: |
          if [ ! -f google-services.json ]; then echo "google-services.json is missing from the repo root"; exit 1; fi
          cp google-services.json android/app/google-services.json
      - name: Add permissions
        run: sed -i 's#</manifest>#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.WAKE_LOCK"/></manifest>#' android/app/src/main/AndroidManifest.xml
      - name: App icon
        continue-on-error: true
        run: npx capacitor-assets generate --android
      - name: Sync
        run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Skhtor Admin build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
