name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install packages
        run: npm install
      - name: Create Android project
        run: npx cap add android
      - name: Add Firebase config
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GSJ" ]; then echo "Missing secret GOOGLE_SERVICES_JSON"; exit 1; fi
          echo "$GSJ" | base64 -d > android/app/google-services.json
      - name: Add permissions
        run: sed -i 's#</manifest>#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.WAKE_LOCK"/></manifest>#' android/app/src/main/AndroidManifest.xml
      - name: App icon
        continue-on-error: true
        run: npx capacitor-assets generate --android
      - name: Sync
        run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Skhtor Admin build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
