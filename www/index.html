const KA=()=>window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.KeepAlive;
let batt=true;
function alarm(){const k=KA();if(k)k.ring().catch(beep);else beep();}
function stopAlarm(){const k=KA();if(k)k.stopRing().catch(()=>{});}
function beat(){if(authed&&pres.open)db.doc("config/presence").set({hb:Date.now()},{merge:true}).catch(()=>{});}
async function chkBatt(){const k=KA();if(!k||!authed)return;try{const r=await k.batteryStatus();if(r.ignoring!==batt){batt=r.ignoring;if(atab==="orders")draw();}}catch(e){}}
async function initKA(){const k=KA();if(!k)return;try{await k.createChannel();await k.start();await chkBatt();if(!batt&&!LS.g("ad_bq")){LS.s("ad_bq",1);k.requestBattery();}}catch(e){}}
function battH(){return KA()&&!batt?`<div class="tbox" style="border:2px solid #dc2626"><b>⚠ Battery optimization is ON</b><div class="note">Android may close this app and you will miss orders.</div><button class="pri" style="margin-top:8px" onclick="KA().requestBattery()">Disable it now</button></div>`:"";}
async function schedRemind(){
 const p=LNP();if(!p)return;
 try{
  await p.cancel({notifications:[...Array(8)].map((_,i)=>({id:9100+i}))});
  if(!hrs||!hrs.enabled)return;
  const n=[],now=new Date();
  for(let i=0;i<8;i++){const d=new Date();d.setDate(d.getDate()+i);const x=hrs.days[d.getDay()];if(!x||!x.on||!/^\d\d:\d\d$/.test(x.o))continue;const t=x.o.split(":");d.setHours(+t[0],+t[1]-30,0,0);if(d<=now)continue;n.push({id:9100+i,title:"⏰ Opening in 30 minutes",body:"Open the Skhtor Admin app and go Online to start receiving orders.",schedule:{at:d,allowWhileIdle:true}});}
  if(n.length)await p.schedule({notifications:n});
 }catch(e){}
}

}

 const o=orders.find(x=>x.id===id);if(!o){closePop();return;}
 killMap();
 const has=pinOK(o.pin),k=has?dist(o):null,m=document.createElement("div");

 m.innerHTML=`<div class="sheet" style="border-radius:22px;max-width:520px;padding:16px"><button class="x" onclick="closePop()" aria-label="Close">×</button><h2 style="font-size:20px;margin:0 0 4px">🔔 ${esc(o.no)} · ${esc(o.mode)}</h2><div class="note">${esc(o.name||"")} · ${fmt(o.total||0)}</div>
 ${has?`<div id="pmap" style="height:min(300px,38vh);border-radius:16px;margin:10px 0;background:var(--card)"></div><div style="font-size:18px;font-weight:800">📏 ${k.toFixed(1)} km <span class="note" style="font-weight:400">straight line from ${SHOPNAME}</span></div><div class="note" id="proad">Calculating road distance…</div>`:`<div class="tbox note">${o.mode==="Delivery"?"No map pin on this order — see the address below.":"No delivery for this order type."}</div>`}
 ${o.addr?`<div style="margin-top:6px">📍 ${esc(o.addr)}</div>`:""}
 <pre style="max-height:90px;overflow:auto">${esc((o.lines||[]).join("\n"))}</pre>
 <div class="st" style="margin-top:8px"><button class="pri" style="flex:2;width:auto" onclick="openFromPop()">Open order</button><button class="ghost" style="flex:1" onclick="closePop()">Close</button></div></div>`;
 document.body.appendChild(m);
 if(has){setTimeout(()=>drawMap(o,k),60);roadDist(o);}
}
function drawMap(o,k){
 const el=$("pmap");if(!el)return;
 if(!window.L){el.innerHTML='<div class="note" style="padding:16px">Map needs internet. Distance: '+k.toFixed(1)+' km</div>';return;}
 try{
  const c=[+o.pin.lat,+o.pin.lon],s=[shop.lat,shop.lon];
  pmap=L.map(el,{attributionControl:true});
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(pmap);
  const ic=e=>L.divIcon({html:'<div style="font-size:28px;line-height:28px;transform:translate(-50%,-100%)">'+e+'</div>',className:"",iconSize:[0,0]});
  L.polyline([s,c],{color:"#f2b90f",weight:4,dashArray:"8 8"}).addTo(pmap);
  L.marker(s,{icon:ic("🏠")}).addTo(pmap);
  L.marker(c,{icon:ic("📍")}).addTo(pmap);
  const fit=()=>{try{pmap.invalidateSize();pmap.fitBounds([s,c],{padding:[36,36],maxZoom:16});}catch(e){}};
  fit();setTimeout(fit,250);
 }catch(e){el.innerHTML='<div class="note" style="padding:16px">Map could not load. Distance: '+k.toFixed(1)+' km</div>';}
}

  const j=await r.json(),x=j.routes&&j.routes[0];if(!x)throw 0;
  const e=$("proad");if(e)e.innerHTML="🛣 ≈ <b>"+(x.distance/1000).toFixed(1)+" km</b> by road · ~"+Math.max(1,Math.round(x.duration/60))+" min drive";
 }catch(e){const q=$("proad");if(q)q.textContent="Road distance unavailable";}
}

function stats(){
 const d=new Date().toDateString(),T=orders.filter(o=>new Date(o.ts).toDateString()===d&&o.status!=="Declined"&&o.status!=="Cancelled");
 return `<div class="tbox"><b>Today:</b> ${T.length} orders · ${fmt(T.reduce((s,o)=>s+(o.total||0),0))}</div>`;
}
function acceptPanel(o){
 const id=o.id,dl=o.mode==="Delivery",pk=o.mode==="Pickup";
 let p=`<div class="tbox">`;
 if(dl||pk)p+=`<div class="note">${dl?"Arrives in (minutes)":"Ready in (minutes)"}</div><div class="chips">${[10,15,20,30,45,60].map(m=>`<button onclick="setEta('${id}',${m})">${m}</button>`).join("")}</div><input type="number" inputmode="numeric" data-k="eta_${id}" placeholder="minutes">`;
 if(!dl)p+=`<div class="note">${pk?"Pickup time (optional)":"Table time"}</div><input type="time" data-k="ct_${id}" value="${/^\d\d:\d\d$/.test(o.when||"")?o.when:""}">`;
 return p+`<input data-k="rs_${id}" placeholder="Reason if declining (optional)"><div class="st" style="margin-top:6px"><button class="pri" style="width:auto;flex:2" onclick="accept('${id}')">✅ Accept</button><button class="ghost" style="flex:1" onclick="decline('${id}')">✕ Decline</button></div></div>`;
}
function card(o){
 const act=!FIN(o.status),dl=o.mode==="Delivery",flow=dl?["Accepted","Preparing","Ready","OnTheWay","Done"]:["Accepted","Preparing","Ready","Done"];
 const Y=p=>p&&isFinite(p.lon)&&isFinite(p.lat)?` · <a target="_blank" rel="noopener" href="https://yandex.com/maps/?pt=${+p.lon},${+p.lat}&z=17&l=map">Yandex Maps</a>`:"";
 const digits=String(o.phone||"").replace(/\D/g,""),D=o=>{const k=dist(o);return k==null?"":"<br>📏 <b>"+k.toFixed(1)+" km</b> from "+SHOPNAME;};
 let h=`<div class="oc ${esc(o.status)}"><b>${esc(o.no)}</b> · ${esc(o.mode)} · ${new Date(o.ts).toLocaleString([], {month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})} <b style="float:inline-end">${fmt(o.total)}</b>
 <div class="note">${esc(SL[o.status]||o.status)}${o.etaMin?" · ETA "+o.etaMin+" min":""}${o.confirmTime?" · ⏰ "+esc(o.confirmTime):""}${o.edited?" · ✏ edited":""}${o.reason?" · "+esc(o.reason):""}</div>
 <pre>${esc((o.lines||[]).join("\n"))}</pre><div>${o.acct==="verified"?"✅ Verified account":o.acct==="phone"?"📱 Signed in with phone (not verified)":o.acct==="guest"?"👤 Guest":""}${o.acct?"<br>":""}${esc(o.name)} · <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a>${digits?` · <a target="_blank" rel="noopener" href="https://wa.me/${digits}">WhatsApp</a>`:""}${o.addr?"<br>📍 "+esc(o.addr)+(o.atype?" ("+esc(o.atype)+")":"")+(o.floor?` · Floor ${esc(o.floor)}, Apt ${esc(o.apt)}`:"")+(o.code?` · 🔑 ${esc(o.code)}`:"")+Y(o.pin)+D(o):""}${o.note?"<br>📝 "+esc(o.note):""}${!dl?`<br>🕐 Customer time: <b>${esc(o.when||"ASAP")}</b>`:""}</div>`;
 if(dl&&o.pin&&isFinite(o.pin.lat)&&isFinite(o.pin.lon))h+=`<button class="ghost" style="margin-top:8px;width:100%" onclick="sharePin('${o.id}')">📤 Share location pin</button>`;
 if(pinOK(o.pin))h+=`<button class="ghost" style="margin-top:8px;width:100%" onclick="showPop('${o.id}')">🗺 Map &amp; distance</button>`;
if(o.status==="New")h+=acceptPanel(o)+actRow(o);
 else if(act){
  h+=`<div class="st" style="margin-top:8px">${flow.map(s=>`<button style="${o.status===s?"background:var(--brand);color:var(--on)":""}" onclick="setSt('${o.id}','${s}')">${esc(SL[s])}</button>`).join("")}</div>`;
  if(o.mode!=="Dine")h+=`<div class="row" style="border:0;margin-top:6px"><input type="number" inputmode="numeric" data-k="eta_${o.id}" placeholder="New ETA (min)" style="flex:1"><button class="ghost" onclick="updEta('${o.id}')">Update ETA</button></div>`;
  h+=msgPanel(o)+actRow(o);
 }
 return h+(act?"":msgHist(o))+`</div>`;
}
function ordersH(h){
 const L=orders.filter(o=>h?FIN(o.status):!FIN(o.status));
 return (h?"":stats()+battH())+(pres.open||h?"":`<p class="note">⚠ You are Offline — customers cannot order. Tap the red button above.</p>`)+(L.length?L.map(card).join(""):`<p class="note">${h?"No past orders yet.":"No active orders. New orders appear here live."}</p>`);
}
function menuH(){
 return secH()+`<h2 style="font-size:18px">Items</h2>`+draft.map((i,k)=>`<div class="mi">${i.img?`<img src="${esc(i.img)}" alt="">`:`<div class="ph"></div>`}<div><div class="g"><input value="${esc(i.n)}" oninput="ed(${k},'n',this.value)" placeholder="Name"><input type="number" value="${i.p}" oninput="ed(${k},'p',+this.value)" placeholder="AMD"></div><input value="${esc(i.d||"")}" oninput="ed(${k},'d',this.value)" placeholder="Description"></div>
 <details><summary class="note">Translations</summary>${["hy","ru","ar"].map(l=>`<input value="${esc((i.tr||{})[l]||"")}" oninput="edt(${k},'${l}',this.value)" placeholder="${LN2[l]}">`).join("")}</details>
 <div class="acts"><select style="width:auto" onchange="ed(${k},'c',+this.value)">${cdraft.map((c,ci)=>`<option value="${ci}" ${ci===i.c?"selected":""}>${esc(c.n)}</option>`).join("")}</select><label><input type="checkbox" style="width:auto" ${i.off?"checked":""} onchange="ed(${k},'off',this.checked)"> Hidden</label><label class="ghost">📷<input type="file" accept="image/*" hidden onchange="upImg(${k},this.files[0])"></label><button class="ghost" onclick="draft.splice(${k},1);draw()">🗑</button></div></div>`).join("")+
 `<div class="chips"><button onclick="draft.push({id:'n'+Date.now(),c:0,n:'New item',d:'',p:0});draw()">＋ Add item</button></div><button class="pri" onclick="saveMenu()">Save menu</button>`;
}
function ed(k,f,v){draft[k][f]=v;}function edt(k,l,v){(draft[k].tr=draft[k].tr||{})[l]=v;}
function upImg(k,f){if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=c.height=200;const x=c.getContext("2d"),m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,200,200);draft[k].img=c.toDataURL("image/jpeg",.6);draw();};im.onerror=()=>toast("Upload failed");im.src=r.result;};r.readAsDataURL(f);}
async function saveMenu(){if(cdraft.some(c=>!String(c.n).trim())){toast("Every section needs a name");return;}try{await db.doc("menu/main").set({items:draft,cats:cdraft.map(c=>({n:c.n.trim(),hy:c.hy||"",ru:c.ru||"",ar:c.ar||""}))});toast("✓ Saved");}catch(e){toast("Could not save: "+(e.code||""));}}
function hoursH(){
 const D=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
 return `<label class="row"><input type="checkbox" style="width:auto" ${hd.enabled?"checked":""} onchange="hd.enabled=this.checked"><span class="n">Use working hours (off = open whenever you are online)</span></label>`+hd.days.map((x,k)=>`<div class="row"><input type="checkbox" style="width:auto" ${x.on?"checked":""} onchange="hd.days[${k}].on=this.checked"><span class="n">${D[k]}</span><input type="time" style="width:auto" value="${esc(x.o)}" onchange="hd.days[${k}].o=this.value"><input type="time" style="width:auto" value="${esc(x.c)}" onchange="hd.days[${k}].c=this.value"></div>`).join("")+`<p class="note">Customers can only order while you are Online and inside these hours.</p><button class="pri" onclick="saveHours()">Save &amp; update users</button>`+shopH();
}
async function saveHours(){try{await db.doc("config/hours").set(hd);toast("✓ Saved");}catch(e){toast("Could not save: "+(e.code||""));}}
function newsH(){return `<p class="note">Message shown to all customers at the top of the menu. Leave empty to remove.</p><textarea id="nw" rows="3">${esc((news&&news.text)||"")}</textarea><button class="pri" onclick="saveNews()">Publish update</button>`;}
async function saveNews(){try{await db.doc("config/news").set({text:$("nw").value.trim(),ts:Date.now()});toast("✓ Saved");}catch(e){toast("Could not save: "+(e.code||""));}}

firebase.initializeApp(FBC);db=firebase.firestore();try{db.settings({experimentalAutoDetectLongPolling:true,merge:true});}catch(e){}
firebase.auth().onAuthStateChanged(u=>{
 if(u&&u.email){authed=true;listen();draw();keepAwake();initPush();initKA();beat();}
 else{authed=false;try{KA().stop();}catch(e){}stopAlarm();if(unsub){unsub();unsub=null;}first=true;orders=[];loginView();}
});
</script></body></html>
